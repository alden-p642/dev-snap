[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-snap"
version = "0.1.0"
description = "Aesthetic terminal snapshot for local Git repositories."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.scripts]
dev-snap = "dev_snap.main:app"